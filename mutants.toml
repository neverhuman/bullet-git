# cargo-mutants baseline. Threshold admission is L-16b; this file only
# names the first examined packages so a later CI lane has a pinned start.
# Do not treat a local mutants run as a release receipt.

examine = [
  "crates/bullet-git-types",
  "crates/bullet-git-journal",
]

exclude_globs = [
  "crates/bullet-git-workspace/fuzz/**",
  "crates/bullet-gitd/**",
]

timeout_multiplier = 2.0
output = "target/mutants"
