[workspace]
resolver = "2"
members = [
  "crates/bullet-git-types",
  "crates/bullet-gitd",
  "crates/bullet-git-journal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Bullet Farm"]

[workspace.dependencies]
bullet-git-types = { path = "crates/bullet-git-types" }
bullet-git-journal = { path = "crates/bullet-git-journal" }
blake3 = "1"
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
