name: CI

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_scan:
    name: source scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned gitleaks
        run: bash ops/ci/install-gitleaks.sh
      - name: Scan source and lockfiles before dependency installation
        run: bash scripts/ci-local.sh source-scan
      - name: Validate sanitized observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh source-scan
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload source-scan observation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-source-scan
          path: .ci-artifacts/observations/source-scan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  fast:
    name: fast
    needs: source_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: Run fast lane
        run: bash scripts/ci-local.sh fast
      - name: Validate sanitized JUnit and observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh fast
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload fast diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-fast
          path: |
            .ci-artifacts/observations/fast.json
            .ci-artifacts/reports/fast.junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  lint:
    name: lint
    needs: source_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install pinned actionlint
        run: bash ops/ci/install-actionlint.sh
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: |
            cargo-nextest@0.9.137
            shellcheck@0.10.0
            zizmor@1.25.2
          fallback: none
      - name: Run lint lane
        run: bash scripts/ci-local.sh lint
      - name: Validate sanitized observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh lint
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload lint observation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-lint
          path: .ci-artifacts/observations/lint.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  contract:
    name: contract
    needs: source_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest@0.9.137
          fallback: none
      - name: Run contract lane
        run: bash scripts/ci-local.sh contract
      - name: Validate sanitized JUnit and observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh contract
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload contract diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-contract
          path: |
            .ci-artifacts/observations/contract.json
            .ci-artifacts/reports/contract.junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security:
    name: security
    needs: source_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
      - name: Install pinned gitleaks
        run: bash ops/ci/install-gitleaks.sh
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-deny@0.19.8
          fallback: none
      - name: Run security lane
        run: bash scripts/ci-local.sh security
      - name: Validate sanitized observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh security
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload security observation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-security
          path: .ci-artifacts/observations/security.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
    name: docs
    needs: source_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.artifacts.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
      - name: Run docs lane
        run: bash scripts/ci-local.sh docs
      - name: Validate sanitized observation
        id: artifacts
        if: ${{ !cancelled() }}
        run: |
          bash ops/ci/artifact-check.sh docs
          echo "observation=present" >> "$GITHUB_OUTPUT"
      - name: Upload docs observation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bullet-git-docs
          path: .ci-artifacts/observations/docs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    needs: [source_scan, fast, lint, contract, security, docs]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Converge exact CI / required context
        env:
          SOURCE_SCAN_RESULT: ${{ needs.source_scan.result }}
          SOURCE_SCAN_OBSERVATION: ${{ needs.source_scan.outputs.observation }}
          FAST_RESULT: ${{ needs.fast.result }}
          FAST_OBSERVATION: ${{ needs.fast.outputs.observation }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINT_OBSERVATION: ${{ needs.lint.outputs.observation }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CONTRACT_OBSERVATION: ${{ needs.contract.outputs.observation }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SECURITY_OBSERVATION: ${{ needs.security.outputs.observation }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_OBSERVATION: ${{ needs.docs.outputs.observation }}
        run: |
          bash ops/ci/aggregate.sh \
            "$SOURCE_SCAN_RESULT" "$SOURCE_SCAN_OBSERVATION" \
            "$FAST_RESULT" "$FAST_OBSERVATION" \
            "$LINT_RESULT" "$LINT_OBSERVATION" \
            "$CONTRACT_RESULT" "$CONTRACT_OBSERVATION" \
            "$SECURITY_RESULT" "$SECURITY_OBSERVATION" \
            "$DOCS_RESULT" "$DOCS_OBSERVATION"
