name: nightly

# Live jeryu-gitd oracle lane (ops/ci/nightly.sh). Neutral when
# BULLET_LIVE_GITD is unset; a request without a registered oracle fails closed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: live-gitd-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
      - name: Nightly (registered oracle only)
        run: bash ops/ci/nightly.sh
        env:
          BULLET_LIVE_GITD: ${{ secrets.BULLET_LIVE_GITD }}
